<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery - magicBubbles</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Josefin+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/art.css">
</head>
<body class="art-body">
    <header class="simple-header">
        <div class="logo-section">
            <img src="../images/bubbles.png" alt="Bubbles" class="bubbles-png">
            <a href="../index.html">magicBubbles</a>
            <button id="musicToggle" class="music-btn" title="Toggle Music">🎵</button>
        </div>
    </header>
    
    <!-- Hidden audio element -->
    <audio id="backgroundMusic" loop>
        <source src="../song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <main class="art-main">
        <div class="content-layout">
            <div class="art-lists">
                <div class="list-section">
              
                    <p style="font-family: 'Pacifico', cursive; font-size: 40px; color: #1f2125;">
                        🎨 Bubble Art Studio<br></p><br><br><br>
                        Currently setting up my digital easel... <br>
                        <br><br> This space will soon be filled with colorful creations and bubbly art!
                        <br><br><br><br><br>So stay tuned bubblies ✨
                    
                </div>
                
               
            </div>
            
            <div class="right-section">
                
                <div class="gif-container">
                    <img src="../images/show-art.gif" alt="Flower Bear GIF" class="flower-bear-gif">
                    
                </div>
            </div>
        </div>
    </main>
</body>

<script src="../music-player.js"></script>

</html>
